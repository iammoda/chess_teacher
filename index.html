<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Chess Teacher</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal Chess Teacher</p>
          <h1>Training Board</h1>
        </div>
        <div class="status-row" aria-live="polite">
          <span id="engineStatus" class="status-pill">Engine starting</span>
          <span id="storageStatus" class="status-pill muted">Local storage</span>
        </div>
      </header>

      <main class="workspace">
        <section class="board-area" aria-label="Chess board and game controls">
          <div class="control-bar">
            <button id="newGameButton" type="button">New game</button>
          </div>

          <div id="board" class="board" aria-label="Interactive chess board"></div>

          <div class="game-footer">
            <div>
              <p class="label">Turn</p>
              <p id="turnText" class="metric">White</p>
            </div>
            <div>
              <p class="label">Opening</p>
              <p id="openingText" class="metric">Starting position</p>
            </div>
            <div>
              <p class="label">Result</p>
              <p id="resultText" class="metric">In progress</p>
            </div>
          </div>
        </section>

        <aside class="teacher-panel" aria-label="Teacher panel">
          <nav class="tabs" aria-label="Teacher views">
            <button class="tab active" type="button" data-tab="coach">Coach</button>
            <button class="tab" type="button" data-tab="review">Review</button>
            <button class="tab" type="button" data-tab="practice">Practice</button>
            <button class="tab" type="button" data-tab="profile">Profile</button>
            <button class="tab" type="button" data-tab="lessons">Lessons</button>
            <button class="tab" type="button" data-tab="settings">Settings</button>
          </nav>

          <section id="coachPanel" class="panel active" data-panel="coach"></section>
          <section id="reviewPanel" class="panel" data-panel="review"></section>
          <section id="practicePanel" class="panel" data-panel="practice"></section>
          <section id="profilePanel" class="panel" data-panel="profile"></section>
          <section id="lessonsPanel" class="panel" data-panel="lessons"></section>
          <section id="settingsPanel" class="panel" data-panel="settings"></section>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
