<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Chess Teacher</title>
    <link rel="icon" href="./assets/squirrel_chess.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="./assets/squirrel_chess.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2.105.4?bundle" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="bootVeil" class="boot-veil" aria-hidden="true">
      <div class="boot-veil-inner">
        <img src="./assets/squirrel_chess.svg" alt="">
        <strong>Personal Chess Teacher</strong>
        <span class="boot-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <div class="shell">
      <aside class="rail" aria-label="Primary navigation">
        <div class="rail-brand">
          <div class="rail-mark"><img src="./assets/squirrel_chess.svg" alt="" aria-hidden="true"></div>
        </div>

        <div class="rail-section">Train</div>
        <button class="nav-item tab active" type="button" data-tab="coach"><span class="nav-mono">C</span><span class="nav-label">Coach</span></button>
        <button class="nav-item tab" type="button" data-tab="review"><span class="nav-mono">R</span><span class="nav-label">Review</span></button>
        <button class="nav-item tab" type="button" data-tab="practice"><span class="nav-mono">P</span><span class="nav-label">Practice</span><span class="nav-badge" id="practiceBadge" hidden>0</span></button>

        <div class="rail-section">You</div>
        <button class="nav-item tab" type="button" data-tab="profile"><span class="nav-mono">P</span><span class="nav-label">Profile</span></button>
        <button class="nav-item tab" type="button" data-tab="settings"><span class="nav-mono">S</span><span class="nav-label">Settings</span></button>

        <div class="rail-foot">
          v 0.6 &middot; local play<br>
          cloud sync with your account
        </div>
      </aside>

      <main class="stage" aria-label="Chess board">
        <div class="seat opponent" id="seatOpponent">
          <div class="avatar" id="opponentAvatar">MO</div>
          <div class="who">
            <span class="name" id="opponentSeatName">Calibration MoBot</span>
            <span class="sub" id="opponentSeatSub">First game &middot; finding your level</span>
          </div>
          <div class="seat-spacer"></div>
          <div class="seat-meta">
            <span class="capture-tray empty" id="opponentCaptureTray" aria-live="polite"></span>
            <span class="clock" id="opponentClock" hidden></span>
            <span class="pill waiting" id="opponentSeatPill"><span class="dot"></span> Waiting</span>
          </div>
        </div>

        <div class="board-stack">
          <div class="eval-bar" id="evalBar" aria-hidden="true" hidden>
            <div class="eval-bar-fill" id="evalBarFill"></div>
            <span class="eval-bar-label" id="evalBarLabel"></span>
          </div>
          <div class="board-host">
            <div id="board" class="board" aria-label="Interactive chess board"></div>
            <svg id="boardArrows" class="board-arrows" viewBox="0 0 8 8" preserveAspectRatio="none" aria-hidden="true"></svg>
          </div>
        </div>

        <div class="seat player" id="seatPlayer">
          <div class="avatar" id="playerAvatar">Y</div>
          <div class="who">
            <span class="name" id="playerSeatName">You</span>
            <span class="sub" id="playerSeatSub">White &middot; move 1</span>
          </div>
          <div class="seat-spacer"></div>
          <div class="seat-meta">
            <span class="capture-tray empty" id="playerCaptureTray" aria-live="polite"></span>
            <span class="clock" id="playerClock" hidden></span>
            <span class="pill" id="playerSeatPill"><span class="dot"></span> Your Turn</span>
          </div>
        </div>
      </main>

      <aside class="context" aria-label="Teacher panel">
        <header class="ctx-head">
          <h2 id="ctxHeadTitle">Coach</h2>
          <span class="meta" id="ctxHeadMeta"></span>
        </header>

        <div class="ctx-body">
          <section id="coachPanel" class="panel active" data-panel="coach"></section>
          <section id="reviewPanel" class="panel" data-panel="review"></section>
          <section id="practicePanel" class="panel" data-panel="practice"></section>
          <section id="profilePanel" class="panel" data-panel="profile"></section>
          <section id="settingsPanel" class="panel" data-panel="settings"></section>
        </div>

        <footer class="ctx-foot">
          <div class="spacer"></div>
          <button class="new-btn" id="newGameButton" type="button">New game</button>
        </footer>
      </aside>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
